border = "#565349"     # panel borders
accent = "#8ea4a2"     # the colour tmux uses for the active pane border
accentMuted = "#625e5a" # dimmest text
text = "#c5c9c5"       # body text
muted = "#625e5a"

addedBg = "#2b3328"        # added row tint
removedBg = "#43242b"      # removed row tint
movedAddedBg = "#252535"   # moved-added tint
movedRemovedBg = "#49443c" # moved-removed tint
contextBg = "#181616"
contextContentBg = "#181616"

addedContentBg = "#44533e"
removedContentBg = "#6e2d33"

addedSignColor = "#76946a"   # added sign
removedSignColor = "#c34043" # removed sign

lineNumberBg = "#181616"
lineNumberFg = "#625e5a" # dimmest text
selectedHunk = "#393836" # two steps up, the cursor_line row

badgeAdded = "#76946a"
badgeRemoved = "#c34043"
badgeNeutral = "#9e9b93" # neutral badge

fileNew = "#76946a"
fileDeleted = "#c34043"
fileRenamed = "#7fb4ca"   # renamed
fileModified = "#dca561"  # modified
fileUntracked = "#625e5a" # untracked

noteBorder = "#8992a7"          # violet -- not a diff or git hue
noteBackground = "#282727"
noteTitleBackground = "#393836"
noteTitleText = "#c5c9c5"

[themes.kanagawa-dragon.syntax_scopes]
"comment" = "#737c73"
"punctuation.definition.comment" = "#737c73"
"string" = "#8a9a7b"
"string.quoted" = "#8a9a7b"
"string.template" = "#8a9a7b"
"string.regexp" = "#c4746e"
"constant.numeric" = "#a292a3"
"constant.language" = "#b6927b"
"constant.character" = "#b6927b"
"keyword" = "#8992a7"
"keyword.control" = "#8992a7"
"storage.type" = "#8992a7"
"storage.modifier" = "#8992a7"
"entity.name.function" = "#8ba4b0"
"support.function" = "#8ba4b0"
"entity.name.type" = "#8ea4a2"
"support.type" = "#8ea4a2"
"support.class" = "#8ea4a2"

[themes.rose-pine]
# Same roles again; see the kanso block for the reasoning. The base is Shiki's
# own rose-pine, which is the palette this theme is derived from -- no
# substitution needed, unlike kanso borrowing kanagawa-wave.
base = "rose-pine"
label = "Rosé Pine"

background = "#090b10" # the darkest surface
panel = "#090b10"      # the diff surface too, not just the sidebar
panelAlt = "#26233a"   # two steps up
border = "#3b3850"     # panel borders
accent = "#9ccfd8"     # the colour tmux uses for the active pane border
accentMuted = "#6e6a86" # dimmest text
text = "#e0def4"       # body text
muted = "#6e6a86"

addedBg = "#263238"        # added row tint
removedBg = "#361f2a"      # removed row tint
movedAddedBg = "#362e32"   # moved-added tint
movedRemovedBg = "#635254" # moved-removed tint
contextBg = "#090b10"
contextContentBg = "#090b10"

addedContentBg = "#4d666d"
removedContentBg = "#723a4d"

addedSignColor = "#9ccfd8"   # added sign
removedSignColor = "#eb6f92" # removed sign

lineNumberBg = "#090b10"
lineNumberFg = "#6e6a86" # dimmest text
selectedHunk = "#26233a" # two steps up, the cursor_line row

badgeAdded = "#9ccfd8"
badgeRemoved = "#eb6f92"
badgeNeutral = "#908caa" # neutral badge

fileNew = "#9ccfd8"
fileDeleted = "#eb6f92"
fileRenamed = "#9ccfd8"   # renamed
fileModified = "#ebbcba"  # modified
fileUntracked = "#908caa" # untracked

# Pine, not violet: rose-pine spends iris on diagnostics and links, and pine on
# nothing the diff or git state uses. Same requirement, different hue.
noteBorder = "#31748f"
noteBackground = "#1f1d2e"
noteTitleBackground = "#26233a"
noteTitleText = "#e0def4"

[themes.rose-pine.syntax_scopes]
"comment" = "#908caa"
"punctuation.definition.comment" = "#908caa"
"string" = "#f6c177"
"string.quoted" = "#f6c177"
"string.template" = "#f6c177"
"string.regexp" = "#ebbcba"
"constant.numeric" = "#f6c177"
"constant.language" = "#f6c177"
"constant.character" = "#f6c177"
"keyword" = "#31748f"
"keyword.control" = "#31748f"
"storage.type" = "#31748f"
"storage.modifier" = "#31748f"
"entity.name.function" = "#ebbcba"
"support.function" = "#ebbcba"
"entity.name.type" = "#9ccfd8"
"support.type" = "#9ccfd8"
"support.class" = "#9ccfd8"

[keybindings]
"hunk.review.nextAnnotatedFile" = ">"
"hunk.review.previousAnnotatedFile" = "<"
