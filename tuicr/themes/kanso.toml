# Kanso Zen for tuicr.
#
# Palette taken verbatim from webhooked/kanso.nvim (lua/kanso/colors.lua and the
# extras/wezterm port) so this matches nvim's `kanso-zen` exactly. Kanso ships
# ports for 14 tools -- alacritty, ghostty, kitty, wezterm, zellij, yazi and so
# on -- but not tmux and not tuicr, which is why both are hand-written here.
#
# Why this file exists: the bundled `dark` theme left the chip foregrounds too
# light, so the mode indicator, the message banners and the update badge came
# out light-on-light and unreadable. Every *_fg below is deliberately the
# background colour.

panel_bg = "#090e13"
bg_highlight = "#22262d"
fg_primary = "#c5c9c7"
fg_secondary = "#a4a7a4"
fg_dim = "#75797f"

diff_add = "#87a987"              # bright green
diff_add_bg = "#2b3328"           # diffGreen
diff_del = "#e46876"              # bright red
diff_del_bg = "#43242b"           # diffRed
diff_context = "#c5c9c7"
diff_hunk_header = "#7fb4ca"      # bright blue
expanded_context_fg = "#5c6066"

syntax_add_bg = "#2b3328"
syntax_del_bg = "#43242b"

file_added = "#87a987"
file_modified = "#e6c384"         # bright yellow
file_deleted = "#e46876"
file_renamed = "#938aa9"          # bright magenta

reviewed = "#87a987"
pending = "#e6c384"

comment_note = "#7fb4ca"
comment_suggestion = "#7aa89f"    # bright cyan
comment_issue = "#e46876"
comment_praise = "#87a987"

border_focused = "#8ea4a2"
border_unfocused = "#393b44"
status_bar_bg = "#1c1e25"
cursor_color = "#e6c384"
cursor_line_bg = "#1c1e25"
branch_name = "#938aa9"
help_indicator = "#909398"

# The chips. Dark text on a light background is the whole point -- this is the
# pair the bundled theme got wrong.
message_info_fg = "#090e13"
message_info_bg = "#7fb4ca"
message_warning_fg = "#090e13"
message_warning_bg = "#e6c384"
message_error_fg = "#090e13"
message_error_bg = "#e46876"
update_badge_fg = "#090e13"
update_badge_bg = "#e6c384"

mode_fg = "#090e13"
mode_bg = "#8ea4a2"
