[mgr]
marker_copied = { fg = "#87a987", bg = "#87a987" }
marker_cut = { fg = "#e46876", bg = "#e46876" }
marker_marked = { fg = "#938aa9", bg = "#938aa9" }
marker_selected = { fg = "#b6927b", bg = "#b6927b" }

cwd = { fg = "#e6c384" }
hovered = { reversed = true }
preview_hovered = { reversed = true }

find_keyword = { fg = "#b6927b", bg = "#090e13" }
find_position = {}

tab_active = { reversed = true }
tab_inactive = {}
tab_width = 1

count_copied = { fg = "#090e13", bg = "#87a987" }
count_cut = { fg = "#090e13", bg = "#e46876" }
count_selected = { fg = "#090e13", bg = "#e6c384" }

border_symbol = "│"
border_style = { fg = "#c5c9c7" }


[mode]
normal_main = { fg = "#090e13", bg = "#8ba4b0" }
normal_alt = { fg = "#8ba4b0", bg = "#090e13" }
select_main = { fg = "#090e13", bg = "#8992a7" }
select_alt = { fg = "#8992a7", bg = "#090e13" }
unset_main = { fg = "#090e13", bg = "#e6c384" }
unset_alt = { fg = "#e6c384", bg = "#090e13" }


[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
overall = { fg = "#c5c9c7", bg = "#090e13" }

progress_label = { fg = "#8ba4b0", bg = "#090e13", bold = true }
progress_normal = { fg = "#090e13", bg = "#090e13" }
progress_error = { fg = "#090e13", bg = "#090e13" }

perm_type = { fg = "#87a987" }
perm_read = { fg = "#e6c384" }
perm_write = { fg = "#e46876" }
perm_exec = { fg = "#7aa89f" }
perm_sep = { fg = "#938aa9" }


[pick]
border = { fg = "#7fb4ca" }
active = { fg = "#938aa9", bold = true }
inactive = {}

[input]
border = { fg = "#7fb4ca" }
title = {}
value = {}
selected = { reversed = true }

[completion]
border = { fg = "#7fb4ca" }
active = { reversed = true }
inactive = {}

[tasks]
border = { fg = "#7fb4ca" }
title = {}
hovered = { fg = "#938aa9" }

[which]
cols = 2
separator = " - "
separator_style = { fg = "#a4a7a4" }
mask = { bg = "#090e13" }
rest = { fg = "#a4a7a4" }
cand = { fg = "#8ea4a2" }
desc = { fg = "#c5c9c7" }

[help]
on = { fg = "#7aa89f" }
run = { fg = "#938aa9" }
desc = {}
hovered = { reversed = true, bold = true }
footer = { fg = "#090e13", bg = "#c5c9c7" }

[notify]
title_info = { fg = "#87a987" }
title_warn = { fg = "#e6c384" }
title_error = { fg = "#e46876" }

[filetype]
rules = [
    # images
    { mime = "image/*", fg = "#e6c384" },

    # media
    { mime = "{audio,video}/*", fg = "#938aa9" },

    # archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e46876" },

    # documents
    { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#a292a3" },

    # broken links
    { url = "*", is = "orphan", fg = "#e46876" },

    # executables
    { url = "*", is = "exec", fg = "#7aa89f" },

    # fallback
    { url = "*", fg = "#c5c9c7" },
    { url = "*/", fg = "#8ba4b0" },
]
