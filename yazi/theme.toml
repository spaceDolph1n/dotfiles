# Yazi colours — Kanso, matching nvim (kanso-zen) and Ghostty.
#
# The dark flavour is generated by `scripts/theme` from the same palette nvim
# reads. It carries no tmtheme, so file *previews* still use yazi's default
# syntax highlighting; only the chrome is themed.
#
# Flavour names must match the directory under flavors/ minus the `.yazi`.
#
# The template already carries two fixes the upstream kanso port needed, and they
# must survive any re-vendoring: `[manager]` -> `[mgr]`, and `name =` -> `url =`
# in the [filetype] rules. The first fails silently, the second is a hard TOML
# parse error on startup.
#
# light stays a hand-vendored kanso flavour: light mode is out of scope here,
# same as tuicr keeping catppuccin-latte.

[flavor]
dark = "rose-pine"
light = "kanso-pearl"
