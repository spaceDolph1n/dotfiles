source-file ~/.config/tmux/tmux.reset.conf

# `screen-256color` has no Smulx capability, so Neovim's undercurl diagnostics
# rendered as plain underlines inside tmux -- and it is why termguicolors has to
# stay pinned in the Neovim config. `tmux-256color` advertises both.
set-option -g default-terminal 'tmux-256color'
# `terminal-features` is the tmux 3.2+ replacement for terminal-overrides, and
# unlike the old ',xterm-256color:RGB' it is not conditional on the outer TERM.
set-option -as terminal-features ',*:RGB'
set-option -as terminal-features ',*:usstyle'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style

setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# No tmux-resurrect / tmux-continuum. Sessions are created on demand by sesh
# (below) and allowed to die; recreating one is a keystroke and a second, so
# persisting layouts to disk mostly persisted stale state -- and continuum's
# auto-restore competed with sesh over what should exist at attach time.
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
# Supplies the C-h/C-j/C-k/C-l passthrough bindings that pair with the
# vim-tmux-navigator plugin already loaded in Neovim. Without it the Neovim side
# had nothing to hand off to, so crossing a pane boundary silently did nothing.
set -g @plugin 'christoomey/vim-tmux-navigator'

# ---------------------------------------------------------------------------
# Project switching
# ---------------------------------------------------------------------------
# Two different things, deliberately on two keys:
#
#   prefix + O   project -> WINDOW in the current session. One session, one
#                numbered window per project (dotfiles #1, web #2, ...).
#                Reuses the window if it already exists.
#   prefix + o   project -> SESSION (sesh). Separate sessions, switched between.
#
# display-popup -E gives the picker a real terminal, which `run-shell` does not.
bind-key "O" display-popup -E -w 80% -h 70% "$HOME/.config/scripts/tmux-project-window"

# ---------------------------------------------------------------------------
# Session switching: sesh (replaces omerxx/tmux-sessionx)
# ---------------------------------------------------------------------------
# sesh is a standalone binary rather than a tmux plugin, so the same session
# picker works from a bare shell too. It keeps the zoxide-backed behaviour.
#
# The old sessionx config also pointed @sessionx-custom-paths at
# /Users/spacedolphin/.config/dotfiles/ -- a username that does not exist on
# this machine, so that entry never resolved.
bind-key "o" run-shell "sesh connect \"$(
	sesh list --icons | fzf-tmux -p 80%,70% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all  ^t tmux  ^g configs  ^x zoxide  ^d kill' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
		--bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
		--bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
		--bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)'
)\""

#catppuccin config
set -g @catppuccin_flavor "kanso"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# The catppuccin fork loads its flavour file from inside its own plugin
# directory, so the custom Kanso theme has to live there. Re-link it on every
# tmux start -- otherwise `prefix + U` (plugin update) wipes the manual symlink
# from the README and the status bar silently reverts.
run-shell 'ln -sf ~/.config/dotfiles/tmux/catppuccin-kanso.tmuxtheme ~/.tmux/plugins/catppuccin-tmux/ 2>/dev/null || true'

run '~/.tmux/plugins/tpm/tpm'
