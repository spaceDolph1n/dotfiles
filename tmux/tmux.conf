source-file ~/.config/tmux/tmux.reset.conf

# tmux-256color, not screen-256color: the latter has no Smulx, so Neovim's
# undercurl rendered as a plain underline. terminal-features is the 3.2+
# replacement for terminal-overrides, and is not conditional on the outer TERM.
set-option -g default-terminal 'tmux-256color'
set-option -as terminal-features ',*:RGB'
set-option -as terminal-features ',*:usstyle'

set -g prefix ^A
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
# Bottom, so the workmux sidebar can own the top edge. With both up there the
# window list and the agent list stacked into two rows of the same information.
set -g status-position bottom

setw -g mode-keys vi

# Pane separation. tmux has no padding/margin options -- panes are adjacent cell
# rectangles and a border is one row/column of characters, so a gap is impossible.
# These three get the perceptual effect instead.
set -g pane-border-lines heavy       # thick line, not a hairline
set -g pane-border-indicators both   # colour + arrows marking the active pane
# Recede the inactive panes rather than spacing them out. The active pane keeps the
# kanso-zen background (#090E13); the ladder lifts the inactive ones toward its
# split colour (#22262D):
#   #0C1117  barely there
#   #0D1218  a hair more   <- current
#   #0F141A  subtle
#   #131820  noticeable
#   #161A20  strong
# Caveat: this only tints cells using the terminal's default background, so a
# full-screen TUI that paints its own stays undimmed. nvim is exempted from that
# by `transparent = true` in nvim/lua/plugins/theme.lua; lazygit, btop and yazi
# still paint their own and will not dim.
set -g window-style        'bg=#0D1218'
set -g window-active-style 'bg=#090E13'
set -g mouse on

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# No tmux-resurrect / tmux-continuum: the only windows worth restoring are the
# agent ones, and `workmux resurrect` already reopens those with --continue.
# Everything else is a `prefix + O` away.
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
# C-h/j/k/l passthrough for Neovim's vim-tmux-navigator; without it, crossing a
# pane boundary from Neovim silently did nothing.
set -g @plugin 'christoomey/vim-tmux-navigator'

# ---------------------------------------------------------------------------
# Project switching
# ---------------------------------------------------------------------------
#   prefix + O   project -> numbered WINDOW in this session, reused if it exists
#
# One session, projects as numbered windows. `prefix + o` used to open each as
# its own sesh SESSION; both the key and sesh are gone -- two windows I switched
# between with H/L beat two sessions I had to pick from. sesh.toml stays as the
# project registry this picker reads (names, icons, paths, startup commands).
#
# display-popup -E gives the picker a real terminal; `run-shell` does not.
bind-key "O" display-popup -E -w 80% -h 70% "$HOME/.config/scripts/tmux-project-window"

# ---------------------------------------------------------------------------
#   prefix + W   worktree, from any session or cwd -- enter takes over this
#                window, alt-enter goes to its own one with the picker still up
#
# Separate key rather than another source inside `prefix + O`: that picker ends
# in `tmux new-window`, whereas a worktree needs `workmux open` to get its agent
# pane and status hooks. Two sources with two different open-actions in one
# picker would be the wrong shape.
bind-key "W" display-popup -E -w 80% -h 70% "$HOME/.config/scripts/worktrees"

# ---------------------------------------------------------------------------
#   prefix + g   next topic off the research queue, as a window with the grill
#                already waiting in it
#
# Deliberately a key and not a schedule: the trigger is whether I have time,
# which only I can see. A scheduler guesses, and windows I had no time for pile
# up until the whole thing reads as noise.
bind-key "g" run-shell "$HOME/.config/scripts/vault-grill"

# ---------------------------------------------------------------------------
#   prefix + D   review the current pane's tree in hunk, zoomed
#
# Takes over `choose-client`, which is only useful with more than one client
# attached. Zoomed rather than left as a half-width split: hunk's split layout
# needs the columns, and a worktree window already has two panes. `prefix + z`
# gives them back without losing the review.
#
# A pane and not a popup, deliberately -- hunk registers the review with a
# loopback daemon so `hunk session` can reach it from another shell, and a popup
# dies on escape. --watch reloads as the tree changes underneath it.
#
# Open files from inside hunk with `e` ($EDITOR), rather than a second bind out
# here that would have to guess which file you meant.
bind-key "D" split-window -h -c "#{pane_current_path}" "hunk diff --watch" \; resize-pane -Z

#catppuccin config
# British spelling: the plugin reads `@catppuccin_flavour`. `_flavor` is ignored
# silently and falls back to mocha.
set -g @catppuccin_flavour "kanso"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
# `@workmux_status` is a per-window option workmux sets from Claude Code hooks
# (hollow = working, pink = needs input, amber = finished). Prefixed here rather
# than left to workmux's own `status_format`, which appends it after the number
# and pins a stale copy of this format per window. Expands to nothing when unset.
set -g @catppuccin_window_default_text "#{?@workmux_status,#{@workmux_status},}#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#{?@workmux_status,#{@workmux_status},}#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_status_modules_right "directory date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{b:pane_current_path}"
set -g @catppuccin_date_time_text "%H:%M"

# The Kanso theme has to live inside the catppuccin plugin dir, and `prefix + U`
# wipes the symlink, so re-link on every start. TPM installs into
# $XDG_CONFIG_HOME/tmux/plugins here, not ~/.tmux/plugins -- hence the env var.
run-shell 'ln -sf ~/.config/dotfiles/tmux/catppuccin-kanso.tmuxtheme "${TMUX_PLUGIN_MANAGER_PATH:-$HOME/.config/tmux/plugins/}/catppuccin-tmux/"'

run '~/.tmux/plugins/tpm/tpm'

# ---------------------------------------------------------------------------
# Overrides — must stay AFTER tpm, or plugins win
# ---------------------------------------------------------------------------
# tmux-yank binds `y` and MouseDragEnd1Pane itself, so these have to be here and
# not in tmux.reset.conf. Copying always worked; the confirmation was missing.
# The helper reports the size and uses `-d 1000` rather than the 4000ms default.
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel '~/.config/dotfiles/scripts/tmux-copy'
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.config/dotfiles/scripts/tmux-copy'

# Pane borders. catppuccin.tmux:287-288 sets both from thm_gray/thm_blue, so set
# earlier these are silently discarded -- which is why the active border was a
# muted #8ea4a2 rather than the magenta the config asked for. Overriding thm_blue
# in catppuccin-kanso.tmuxtheme would work too, but that value is also the
# unfocused-window and clock colour.
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# `fill=` is REQUIRED as of tmux 3.7 and `bg=` alone is not enough: without it
# the prompt renders as a box that grows as you type, window names showing
# around it. That is what broke on the 3.7 upgrade.
set -g message-style "fg=#090E13,bg=#8ea4a2,align=left,fill=#8ea4a2"
set -g message-command-style "fg=#C5C9C7,bg=#22262D,align=left,fill=#22262D"

# ---------------------------------------------------------------------------
# Breathing room above the status bar
# ---------------------------------------------------------------------------
# tmux pads only in whole status ROWS (`status 2..5`), so one row is the
# smallest gap there is. Row [0] is the upper of the two whichever edge the bar
# sits on, so moving to status-position bottom moves the gap from [1] to [0] --
# and the bar itself has to move to [1] with it. The gap BELOW comes from
# wezterm's window_padding.bottom instead, which is in pixels and can be a
# fraction of a row.
set -g status 2
# tmux has no "copy this format" primitive, so lift its default out of [0] and
# blank what is left. The `set -gu` first is what makes a re-source safe: by then
# [0] is already "" and copying that would blank the bar entirely. It has to
# unset the WHOLE array and not `status-format[0]` -- unsetting one index leaves
# that index empty rather than restoring its default, which blanks the bar in a
# way that looks exactly like the bug it is there to prevent.
run-shell 'tmux set -gu status-format; tmux set -g "status-format[1]" "$(tmux show -gv "status-format[0]")"; tmux set -g "status-format[0]" ""'
