# Generated by `scripts/theme` -- do not edit. Edit tmux/theme.conf.tmpl.
#
# This replaces omerxx/catppuccin-tmux. The plugin wanted its palette as a file
# inside its own directory, which meant re-symlinking on every tmux start because
# `prefix + U` wiped it, and it spoke catppuccin's `thm_*` names so the mapping
# was guesswork. Every string below started as what the plugin actually set, read
# out of a live server with `show-options -g` / `show-window-options -g`, with the
# colours swapped for roles. Two deliberate departures: the rounded caps are gone,
# and the prefix indicator therefore rides the session icon's background instead of
# that cap's foreground.
#
# Glyphs are load-bearing and easy to lose: the session icon (U+E795), the
# directory icon (U+F07B), the clock (U+F00F0), the zoom marker (U+EB81), the
# window block (U+2588) and the U+00A0 that separates windows. The plugin's
# rounded caps (U+E0B6/U+E0B4) are deliberately gone.
#
# Nine of these were set ONLY by the plugin and by nothing in this repo, so
# dropping it without them would have regressed the next fresh server:
# status-bg, status-justify, status-left-length, status-right-length,
# window-status-style, window-status-activity-style, window-status-separator,
# clock-mode-colour, mode-style.

# --- surfaces ----------------------------------------------------------------

set -g status-style        'bg=#090e13,fg=#c5c9c7'
set -g status-bg           '#090e13'
set -g status-fg           '#c5c9c7'
set -g status-justify      left
set -g status-left-length  100
set -g status-right-length 100

# Recede the inactive panes rather than spacing them out. The active pane keeps
# the theme's own background; `ui.bg_inactive` lifts the inactive ones a sixth of
# the way toward the split colour. Only cells using the terminal's default
# background tint, so a full-screen TUI that paints its own stays undimmed --
# nvim is exempt via `transparent = true`, but lazygit, btop and yazi are not.
set -g window-style        'bg=#0d1218'
set -g window-active-style 'bg=#090e13'

set -g pane-active-border-style 'fg=#8ea4a2,bg=default'
set -g pane-border-style        'fg=#22262d,bg=default'

# `fill=` is REQUIRED as of tmux 3.7 and `bg=` alone is not enough: without it
# the prompt renders as a box that grows as you type, window names showing
# around it. That is what broke on the 3.7 upgrade.
set -g message-style         'fg=#090e13,bg=#8ea4a2,align=left,fill=#8ea4a2'
set -g message-command-style 'fg=#c5c9c7,bg=#22262d,align=left,fill=#22262d'

set -g clock-mode-colour '#8ea4a2'

# --- status line -------------------------------------------------------------
#
# Flat: no background fills anywhere. The catppuccin layout this replaced was
# built out of filled chips closed by rounded caps, and with the caps gone the
# chips butt together and read as one solid bar. Colour and weight carry the
# structure instead, so there are no edges to get wrong.
#
# The prefix indicator is back on the session icon's FOREGROUND, which is where
# it belongs -- it rode the rounded cap before, and a cap-less filled chip could
# only signal it by swapping its background.
#
# Glyphs, all written as escapes in the generator because a literal gets stripped
# in transit: session U+E795, directory U+F07B, clock U+F00F0, zoom U+EB81,
# active-name colour U+none -- the marker is colour, not a glyph.

set -g status-left "#[fg=#{?client_prefix,#e46876,#8ea4a2},bg=#090e13]  #[fg=#c5c9c7]#S  "

set -g status-right "#[fg=#8ea4a2,bg=#090e13] #[fg=#a4a7a4]#{b:pane_current_path}   #[fg=#8ea4a2]󰃰 #[fg=#a4a7a4]%H:%M "

# --- windows -----------------------------------------------------------------
#
# `@workmux_status` is a per-window option workmux sets from Claude Code hooks
# (hollow = working, pink = needs input, amber = finished). Prefixed here rather
# than left to workmux's own `status_format`, which appends it after the number
# and pins a stale copy of this format per window. Expands to nothing when unset.
#
# The active window is marked by text strength alone: its name is `ui.fg`, the
# others `ui.nontext`. No accent is borrowed, which is the point: it leaves amber
# free for workmux's `done`.
#
# `ui.fg_dim` was tried for the inactive name and rejected -- 1.45:1 against the
# active name in kanso and 1.10:1 in dragon, which is no separation at all.
# `ui.nontext` gives 3.78:1 and 3.84:1.

set -g window-status-format " #[fg=#5c6066]#I #{?@workmux_status,#{@workmux_status},}#[fg=#5c6066]#W  "

set -g window-status-current-format " #[fg=#5c6066]#I #{?@workmux_status,#{@workmux_status},}#[fg=#c5c9c7]#W#{?window_zoomed_flag,(),}  "

set -g window-status-style          'fg=#5c6066,bg=#090e13,none'
set -g window-status-activity-style 'fg=#c5c9c7,bg=#090e13,none'
set -g window-status-separator      ''
